name: Deploy everything to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CL-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: |
          for d in functions-*/; do
            if [ -f "$d/package.json" ]; then (cd "$d" && npm ci --omit=dev || npm install --omit=dev); fi
          done

      - name: Authenticate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CSE_C_HUB }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy hosting, Firestore (rules + indexes), Storage rules and all Cloud Functions
        run: firebase deploy --only hosting,firestore,storage,functions --project cse-c-hub --non-interactive
