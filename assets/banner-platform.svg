<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Campus Loop The all-in-one student platform" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a1f"/><stop offset=".55" stop-color="#15124a"/><stop offset="1" stop-color="#0b1430"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset=".5" stop-color="#ff8a3d"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfc9ff"/></linearGradient>
  <radialGradient id="g1" cx=".15" cy=".2" r=".6"><stop offset="0" stop-color="#7c6cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx=".9" cy=".9" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<style>
  text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
  .spin{transform-origin:210px 210px;animation:spin 14s linear infinite}
  .spin2{transform-origin:210px 210px;animation:spin 22s linear infinite reverse}
  .pulse{transform-origin:210px 210px;animation:pulse 3.6s ease-in-out infinite}
  .fl{animation:fl 6s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
<rect width="1200" height="420" rx="26" fill="url(#bg)"/>
<rect width="1200" height="420" rx="26" fill="url(#grid)"/>
<rect width="1200" height="420" rx="26" fill="url(#g1)"/>
<rect width="1200" height="420" rx="26" fill="url(#g2)"/>
<g class="fl" opacity=".9"><circle cx="1020" cy="86" r="4" fill="#7c6cff"/><circle cx="1110" cy="150" r="3" fill="#ff8a3d"/><circle cx="960" cy="330" r="5" fill="#22d3ee"/><circle cx="1090" cy="320" r="2.5" fill="#fff"/><circle cx="640" cy="60" r="2.5" fill="#fff" fill-opacity=".7"/></g>
<g>
  <circle class="pulse" cx="210" cy="210" r="118" fill="none" stroke="url(#ring)" stroke-width="14" filter="url(#glow)" opacity=".7"/>
  <circle cx="210" cy="210" r="118" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" stroke-dasharray="620 130"/>
  <g class="spin"><circle cx="210" cy="92" r="11" fill="#fff"/><circle cx="210" cy="92" r="20" fill="#fff" fill-opacity=".18"/></g>
  <g class="spin2"><circle cx="210" cy="330" r="7" fill="#22d3ee"/></g>
  <circle cx="210" cy="210" r="86" fill="#0d0b2b" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="210" y="232" text-anchor="middle" font-size="64" font-weight="800" fill="url(#ring)" letter-spacing="2">CL</text>
</g>
<text x="400" y="188" font-size="82" font-weight="800" fill="url(#ttl)" letter-spacing="5">CAMPUS LOOP</text>
<rect x="404" y="206" width="150" height="5" rx="2.5" fill="url(#ring)"/>
<text x="402" y="262" font-size="29" font-weight="600" fill="#ff8a3d">The all-in-one student platform</text>
<text x="402" y="298" font-size="18" fill="#b9b6e0">Schedule · Study · Contests · Community · Connect — one loop for campus life</text>
<g transform="translate(402,328)"><g transform="translate(0,0)"><rect width="54" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22"/><text x="27" y="22.5" text-anchor="middle" font-size="14" fill="#e9e7ff" font-weight="600">Web</text></g><g transform="translate(65.6,0)"><rect width="90" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22"/><text x="45" y="22.5" text-anchor="middle" font-size="14" fill="#e9e7ff" font-weight="600">Android</text></g><g transform="translate(168.0,0)"><rect width="100" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22"/><text x="50" y="22.5" text-anchor="middle" font-size="14" fill="#e9e7ff" font-weight="600">Firebase</text></g><g transform="translate(279.6,0)"><rect width="136" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22"/><text x="68" y="22.5" text-anchor="middle" font-size="14" fill="#e9e7ff" font-weight="600">AI Companion</text></g></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>